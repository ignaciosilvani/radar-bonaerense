name: Actualizar Radar Bonaerense

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2

      - name: Instalar paquetes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::jsonlite
            any::purrr
            any::stringr
            any::tibble
            any::xml2
            any::httr2
            any::lubridate
            any::tidyr
            any::rvest
            any::future
            any::future.apply

      - name: Ejecutar actualización del Radar
        run: Rscript 09_actualizar_radar_completo.R
        
     
      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/noticias_7d.json noticias_historicas.rds vistas_noticias.rds data/ultima_actualizacion.json
          git diff --cached --quiet || git commit -m "Actualizar datos del Radar"
          git push origin main

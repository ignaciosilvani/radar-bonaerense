name: Actualizar Radar Bonaerense

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2

      - name: Instalar paquetes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::jsonlite
            any::purrr
            any::stringr
            any::tibble
            any::xml2
            any::httr2
            any::lubridate
            any::tidyr
            any::rvest
            any::future

      - name: Ejecutar actualización del Radar
        run: Rscript 09_actualizar_radar_completo.R

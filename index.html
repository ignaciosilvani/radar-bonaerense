<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Radar Bonaerense</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;
      color: #202124;
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 25px;
    }

    /* =====================================================
       ENCABEZADO
       ===================================================== */

    .radar-header {
      background: white;
      border-bottom: 1px solid #e2e5e8;
      padding: 22px 0;
      margin-bottom: 20px;
    }

    .radar-identidad {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .radar-marca {
      font-size: 34px;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
    }

    .radar-subtitulo {
      font-size: 18px;
      color: #5f6368;
      line-height: 1.35;
      font-weight: 400;
    }

    .radar-actualizacion {
      margin-left: auto;
      text-align: right;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.4;
    }

    .radar-actualizacion strong {
      color: #374151;
    }

    /* =====================================================
       FILTROS
       ===================================================== */

    .panel-filtros {
      background: white;
      border: 1px solid #e1e5e9;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .filtros-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .campo label {
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 6px;
    }

    select,
    input[type="text"] {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      font-size: 14px;
      color: #202124;
    }

    select:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #6b7280;
    }

    .busqueda {
      margin-top: 15px;
    }

    /* =====================================================
       PESTAÑAS
       ===================================================== */

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 15px;
      border-bottom: 1px solid #dfe3e8;
    }

    .tab {
      border: none;
      background: transparent;
      padding: 12px 18px;
      font-size: 14px;
      color: #6b7280;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }

    .tab:hover {
      color: #111827;
    }

    .tab.active {
      color: #111827;
      font-weight: 600;
      border-bottom-color: #374151;
    }

    /* =====================================================
       MÉTRICAS
       ===================================================== */

    .metricas {
      display: flex;
      gap: 15px;
      margin-bottom: 18px;
    }

    .metrica {
      background: white;
      border: 1px solid #e1e5e9;
      border-radius: 10px;
      padding: 15px 20px;
      flex: 1;
    }

    .metrica-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .metrica-valor {
      font-size: 25px;
      font-weight: 700;
      color: #202124;
    }

    /* =====================================================
       NOTICIAS
       ===================================================== */

    .noticias {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .noticia {
      background: white;
      border: 1px solid #e1e5e9;
      border-radius: 10px;
      padding: 17px 20px;
      transition: box-shadow 0.15s ease;
    }

    .noticia:hover {
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .noticia-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 7px;
    }

    .noticia-medio {
      font-weight: 600;
      color: #374151;
    }

    .noticia-separador {
      color: #b0b5bb;
    }

    .noticia-seccion {
      color: #6b7280;
    }

    .noticia-titulo {
      margin: 0 0 7px 0;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 650;
    }

    .noticia-titulo a {
      color: #202124;
      text-decoration: none;
    }

    .noticia-titulo a:hover {
      text-decoration: underline;
    }

    .noticia-descripcion {
      font-size: 13px;
      line-height: 1.5;
      color: #646b73;
      margin-bottom: 8px;
    }

    .noticia-ubicacion {
      font-size: 11px;
      color: #858b92;
    }

    .sin-resultados {
      background: white;
      border: 1px solid #e1e5e9;
      border-radius: 10px;
      padding: 35px;
      text-align: center;
      color: #6b7280;
    }

    .estado {
      background: white;
      border: 1px solid #e1e5e9;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      color: #6b7280;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 900px) {
      .filtros-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .radar-identidad {
        flex-wrap: wrap;
      }

      .radar-actualizacion {
        width: 100%;
        margin-left: 0;
        text-align: left;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 0 15px;
      }

      .radar-identidad {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .radar-marca {
        font-size: 28px;
      }

      .radar-subtitulo {
        font-size: 15px;
      }

      .filtros-grid {
        grid-template-columns: 1fr;
      }

      .metricas {
        flex-direction: column;
      }

      .tabs {
        overflow-x: auto;
      }

      .tab {
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       ENCABEZADO
       ===================================================== -->

  <header class="radar-header">

    <div class="container">

      <div class="radar-identidad">

        <div class="radar-marca">
          Radar Bonaerense
        </div>

        <div class="radar-subtitulo">
          Detección y seguimiento de noticias publicadas por medios bonaerenses
        </div>

        <div class="radar-actualizacion">
          <strong>Última actualización</strong><br>
          <span id="ultimaActualizacion">Cargando...</span>
        </div>

      </div>

    </div>

  </header>


  <main class="container">

    <!-- ===================================================
         FILTROS
         =================================================== -->

    <section class="panel-filtros">

      <div class="filtros-grid">

        <div class="campo">
          <label for="seccion">Sección</label>
          <select id="seccion">
            <option value="">Todas</option>
          </select>
        </div>

        <div class="campo">
          <label for="partido">Partido</label>
          <select id="partido">
            <option value="">Todos</option>
          </select>
        </div>

        <div class="campo">
          <label for="localidad">Localidad</label>
          <select id="localidad">
            <option value="">Todas</option>
          </select>
        </div>

        <div class="campo">
          <label for="medio">Medio</label>
          <select id="medio">
            <option value="">Todos</option>
          </select>
        </div>

      </div>

      <div class="busqueda campo">

        <label for="busqueda">Buscar</label>

        <input
          type="text"
          id="busqueda"
          placeholder="Buscar en títulos y noticias..."
        >

      </div>

    </section>


    <!-- ===================================================
         PESTAÑAS
         =================================================== -->

    <nav class="tabs">

      <button
        class="tab active"
        data-periodo="ahora">
        Ahora
      </button>

      <button
        class="tab"
        data-periodo="24h">
        Últimas 24 horas
      </button>

      <button
        class="tab"
        data-periodo="7d">
        Últimos 7 días
      </button>

    </nav>


    <!-- ===================================================
         MÉTRICAS
         =================================================== -->

    <section class="metricas">

      <div class="metrica">
        <div class="metrica-label">
          Noticias
        </div>

        <div
          class="metrica-valor"
          id="cantidadNoticias">
          0
        </div>
      </div>

      <div class="metrica">
        <div class="metrica-label">
          Medios
        </div>

        <div
          class="metrica-valor"
          id="cantidadMedios">
          0
        </div>
      </div>

      <div class="metrica">
        <div class="metrica-label">
          Partidos
        </div>

        <div
          class="metrica-valor"
          id="cantidadPartidos">
          0
        </div>
      </div>

    </section>


    <!-- ===================================================
         NOTICIAS
         =================================================== -->

    <section id="noticias" class="noticias">

      <div class="estado">
        Cargando noticias...
      </div>

    </section>

  </main>


  <script>

    /* =====================================================
       CONFIGURACIÓN
       ===================================================== */

    const URL_DATOS = "data/noticias_7d.json";

    let noticias = [];

    let periodoActual = "ahora";


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const seccionSelect = document.getElementById("seccion");
    const partidoSelect = document.getElementById("partido");
    const localidadSelect = document.getElementById("localidad");
    const medioSelect = document.getElementById("medio");
    const busquedaInput = document.getElementById("busqueda");

    const noticiasContainer = document.getElementById("noticias");

    const cantidadNoticias = document.getElementById("cantidadNoticias");
    const cantidadMedios = document.getElementById("cantidadMedios");
    const cantidadPartidos = document.getElementById("cantidadPartidos");

    const ultimaActualizacion =
      document.getElementById("ultimaActualizacion");


    /* =====================================================
       CARGAR JSON
       ===================================================== */

    async function cargarNoticias() {

      try {

        const respuesta = await fetch(
          URL_DATOS + "?t=" + Date.now()
        );

        if (!respuesta.ok) {
          throw new Error(
            "No se pudo cargar el archivo de noticias."
          );
        }

        noticias = await respuesta.json();

        prepararFiltros();

        actualizar();

      } catch (error) {

        console.error(error);

        noticiasContainer.innerHTML = `
          <div class="estado">
            No se pudieron cargar las noticias.
          </div>
        `;

      }

    }


    /* =====================================================
       FECHAS
       ===================================================== */

    function convertirFecha(fecha) {

      if (!fecha) {
        return null;
      }

      /*
       * El JSON usa:
       *
       * YYYY-MM-DD HH:MM:SS
       *
       * Lo convertimos a ISO para JavaScript.
       */

      return new Date(
        fecha.replace(" ", "T")
      );

    }


    function formatearFecha(fecha) {

      const d = convertirFecha(fecha);

      if (!d || isNaN(d)) {
        return "";
      }

      return d.toLocaleString(
        "es-AR",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* =====================================================
       FILTROS
       ===================================================== */

    function valoresUnicos(campo) {

      return [
        ...new Set(

          noticias

            .map(n => n[campo])

            .filter(
              x =>
                x !== null &&
                x !== undefined &&
                String(x).trim() !== ""
            )

        )

      ].sort(
        (a, b) =>
          String(a).localeCompare(
            String(b),
            "es"
          )
      );

    }


    function llenarSelect(select, valores, textoInicial) {

      select.innerHTML = "";

      const opcionInicial =
        document.createElement("option");

      opcionInicial.value = "";
      opcionInicial.textContent = textoInicial;

      select.appendChild(opcionInicial);

      valores.forEach(valor => {

        const opcion =
          document.createElement("option");

        opcion.value = valor;
        opcion.textContent = valor;

        select.appendChild(opcion);

      });

    }


    function prepararFiltros() {

      llenarSelect(
        seccionSelect,
        valoresUnicos("seccion"),
        "Todas"
      );

      llenarSelect(
        partidoSelect,
        valoresUnicos("partido"),
        "Todos"
      );

      llenarSelect(
        localidadSelect,
        valoresUnicos("localidad"),
        "Todas"
      );

      llenarSelect(
        medioSelect,
        valoresUnicos("medio"),
        "Todos"
      );

    }


    /* =====================================================
       PERÍODOS
       ===================================================== */

    function noticiasPorPeriodo() {

      const ahora = new Date();

      let limite;

      if (periodoActual === "ahora") {

        /*
         * "Ahora" = últimas 2 horas.
         */

        limite =
          new Date(
            ahora.getTime() -
            2 * 60 * 60 * 1000
          );

      } else if (periodoActual === "24h") {

        limite =
          new Date(
            ahora.getTime() -
            24 * 60 * 60 * 1000
          );

      } else {

        limite =
          new Date(
            ahora.getTime() -
            7 * 24 * 60 * 60 * 1000
          );

      }

      return noticias.filter(n => {

        const fecha =
          convertirFecha(n.fecha);

        return fecha && fecha >= limite;

      });

    }


    /* =====================================================
       FILTRADO
       ===================================================== */

    function noticiasFiltradas() {

      let datos =
        noticiasPorPeriodo();


      const seccion =
        seccionSelect.value;

      const partido =
        partidoSelect.value;

      const localidad =
        localidadSelect.value;

      const medio =
        medioSelect.value;

      const busqueda =
        busquedaInput.value
          .trim()
          .toLowerCase();


      if (seccion) {

        datos =
          datos.filter(
            n => n.seccion === seccion
          );

      }


      if (partido) {

        datos =
          datos.filter(
            n => n.partido === partido
          );

      }


      if (localidad) {

        datos =
          datos.filter(
            n => n.localidad === localidad
          );

      }


      if (medio) {

        datos =
          datos.filter(
            n => n.medio === medio
          );

      }


      if (busqueda) {

        datos =
          datos.filter(n => {

            const texto = [

              n.titulo,
              n.descripcion,
              n.medio,
              n.partido,
              n.localidad,
              n.seccion

            ]

              .filter(Boolean)

              .join(" ")

              .toLowerCase();

            return texto.includes(busqueda);

          });

      }


      return datos;

    }


    /* =====================================================
       MÉTRICAS
       ===================================================== */

    function actualizarMetricas(datos) {

      cantidadNoticias.textContent =
        datos.length.toLocaleString("es-AR");


      const medios =
        new Set(
          datos
            .map(n => n.medio)
            .filter(Boolean)
        );

      cantidadMedios.textContent =
        medios.size.toLocaleString("es-AR");


      const partidos =
        new Set(
          datos
            .map(n => n.partido)
            .filter(Boolean)
        );

      cantidadPartidos.textContent =
        partidos.size.toLocaleString("es-AR");

    }


    /* =====================================================
       TARJETAS DE NOTICIAS
       ===================================================== */

    function escaparHTML(texto) {

      if (
        texto === null ||
        texto === undefined
      ) {
        return "";
      }

      return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function crearNoticia(noticia) {

      const titulo =
        escaparHTML(
          noticia.titulo
        );

      const descripcion =
        noticia.descripcion
          ? escaparHTML(
              noticia.descripcion
            )
          : "";

      const medio =
        escaparHTML(
          noticia.medio || ""
        );

      const seccion =
        escaparHTML(
          noticia.seccion || ""
        );

      const partido =
        escaparHTML(
          noticia.partido || ""
        );

      const localidad =
        escaparHTML(
          noticia.localidad || ""
        );

      const fecha =
        formatearFecha(
          noticia.fecha
        );

      const url =
        noticia.url || "#";


      const ubicacion =
        [partido, localidad]
          .filter(Boolean)
          .join(" · ");


      return `

        <article class="noticia">

          <div class="noticia-meta">

            <span class="noticia-medio">
              ${medio}
            </span>

            ${
              seccion
                ? `
                  <span class="noticia-separador">
                    ·
                  </span>

                  <span class="noticia-seccion">
                    ${seccion}
                  </span>
                `
                : ""
            }

            ${
              fecha
                ? `
                  <span class="noticia-separador">
                    ·
                  </span>

                  <span>
                    ${fecha}
                  </span>
                `
                : ""
            }

          </div>


          <h2 class="noticia-titulo">

            <a
              href="${url}"
              target="_blank"
              rel="noopener noreferrer">

              ${titulo}

            </a>

          </h2>


          ${
            descripcion
              ? `
                <div class="noticia-descripcion">
                  ${descripcion}
                </div>
              `
              : ""
          }


          ${
            ubicacion
              ? `
                <div class="noticia-ubicacion">
                  ${ubicacion}
                </div>
              `
              : ""
          }

        </article>

      `;

    }


    /* =====================================================
       MOSTRAR NOTICIAS
       ===================================================== */

    function mostrarNoticias(datos) {

      if (!datos.length) {

        noticiasContainer.innerHTML = `

          <div class="sin-resultados">

            No se encontraron noticias
            para los filtros seleccionados.

          </div>

        `;

        return;

      }


      noticiasContainer.innerHTML =
        datos
          .map(crearNoticia)
          .join("");

    }


    /* =====================================================
       ACTUALIZAR INTERFAZ
       ===================================================== */

    function actualizar() {

      const datos =
        noticiasFiltradas();


      actualizarMetricas(datos);

      mostrarNoticias(datos);


      if (noticias.length) {

        const fechas =
          noticias

            .map(n =>
              convertirFecha(n.fecha)
            )

            .filter(Boolean)

            .sort(
              (a, b) =>
                b - a
            );


        if (fechas.length) {

          ultimaActualizacion.textContent =
            fechas[0].toLocaleString(
              "es-AR",
              {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
              }
            );

        }

      }

    }


    /* =====================================================
       EVENTOS
       ===================================================== */

    [
      seccionSelect,
      partidoSelect,
      localidadSelect,
      medioSelect
    ].forEach(elemento => {

      elemento.addEventListener(
        "change",
        actualizar
      );

    });


    busquedaInput.addEventListener(
      "input",
      actualizar
    );


    document
      .querySelectorAll(".tab")
      .forEach(tab => {

        tab.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".tab")
              .forEach(t =>
                t.classList.remove("active")
              );

            tab.classList.add("active");

            periodoActual =
              tab.dataset.periodo;

            actualizar();

          }
        );

      });


    /* =====================================================
       INICIO
       ===================================================== */

    cargarNoticias();


    /*
     * Comprobamos cada 5 minutos si el JSON
     * cambió en GitHub.
     *
     * No depende de R ni de Shiny.
     */

    setInterval(
      cargarNoticias,
      5 * 60 * 1000
    );

  </script>

</body>
</html>
